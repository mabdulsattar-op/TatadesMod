name: Build Tatade's Mod

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build:
    name: Build on Ubuntu
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Print Java version
      run: java -version

    - name: Ensure gradlew is executable if present
      run: |
        if [ -f ./gradlew ]; then chmod +x ./gradlew; fi
      shell: bash

    - name: Build with Gradle (use official Gradle Action)
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: '8.6.4'
        arguments: 'build --no-daemon'

    - name: List build output
      run: ls -la build/libs || true

    - name: Upload artifact (JAR)
      uses: actions/upload-artifact@v4
      with:
        name: tatadesmod-jar
        path: build/libs/tatadesmod-1.0.0.jar

    - name: Archive full logs (on failure)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: gradle-failure-logs
        path: |
                    build/reports/**
                    build/logs/**
                    ./**
